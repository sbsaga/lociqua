services:
  app:
    build: .
    environment:
      LOCIQUA_DATABASE_PATH: /app/data/lociqua.db
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://lociqua:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lociqua
      LOCIQUA_WORKSPACE_ID: ${LOCIQUA_WORKSPACE_ID:-00000000-0000-0000-0000-000000000001}
      LOCIQUA_REQUIRE_AUTH: "true"
      LOCIQUA_AUTH_SECRET: ${LOCIQUA_AUTH_SECRET:?set a 32+ character LOCIQUA_AUTH_SECRET in .env}
      LOCIQUA_BOOTSTRAP_EMAIL: ${LOCIQUA_BOOTSTRAP_EMAIL:?set initial owner email in .env}
      LOCIQUA_BOOTSTRAP_PASSWORD: ${LOCIQUA_BOOTSTRAP_PASSWORD:?set 12+ character initial owner password in .env}
      LOCIQUA_ALERT_WEBHOOK_URL: ${LOCIQUA_ALERT_WEBHOOK_URL:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [app_data:/app/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: lociqua
      POSTGRES_USER: lociqua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data, ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lociqua -d lociqua"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: .
    command: ["python", "-m", "business_discovery.worker"]
    environment:
      DATABASE_URL: postgresql://lociqua:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lociqua
      REDIS_URL: redis://redis:6379/0
      LOCIQUA_WORKSPACE_ID: ${LOCIQUA_WORKSPACE_ID:-00000000-0000-0000-0000-000000000001}
      LOCIQUA_ALERT_WEBHOOK_URL: ${LOCIQUA_ALERT_WEBHOOK_URL:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  proxy:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes: {app_data: {}, postgres_data: {}, redis_data: {}}
