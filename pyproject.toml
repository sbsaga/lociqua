[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lociqua"
version = "0.1.0"
description = "Self-hosted, provider-agnostic business discovery from authorized data"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["psycopg[binary]>=3.2,<4", "redis>=5,<7"]

[project.scripts]
search-businesses = "business_discovery.cli:main"

[tool.setuptools.packages.find]
include = ["business_discovery*"]
