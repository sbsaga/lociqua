<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Authorized data to searchable directory</title><desc id="desc">A flow from permitted data sources through import, normalization, provenance and controlled use.</desc>
  <rect width="1200" height="300" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#11264b}.box{fill:#fff;stroke:#2b6cb0;stroke-width:2}.arrow{stroke:#2b6cb0;stroke-width:3;marker-end:url(#a)}.small{font-size:16px}.label{font-size:20px;font-weight:bold}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2b6cb0"/></marker></defs>
  <text x="600" y="38" text-anchor="middle" class="label">From authorized business data to controlled decisions</text>
  <g transform="translate(35 95)"><rect class="box" width="175" height="110" rx="14"/><text x="87" y="45" text-anchor="middle" class="label">Permitted data</text><text x="87" y="75" text-anchor="middle" class="small">CRM · licensed export</text><text x="87" y="96" text-anchor="middle" class="small">approved CSV</text></g>
  <g transform="translate(270 95)"><rect class="box" width="175" height="110" rx="14"/><text x="87" y="50" text-anchor="middle" class="label">Import</text><text x="87" y="80" text-anchor="middle" class="small">validate and bound input</text></g>
  <g transform="translate(505 95)"><rect class="box" width="175" height="110" rx="14"/><text x="87" y="45" text-anchor="middle" class="label">Normalize</text><text x="87" y="75" text-anchor="middle" class="small">standardize fields</text><text x="87" y="96" text-anchor="middle" class="small">find candidates</text></g>
  <g transform="translate(740 95)"><rect class="box" width="175" height="110" rx="14"/><text x="87" y="50" text-anchor="middle" class="label">Provenance</text><text x="87" y="80" text-anchor="middle" class="small">source and audit history</text></g>
  <g transform="translate(975 95)"><rect class="box" width="175" height="110" rx="14"/><text x="87" y="45" text-anchor="middle" class="label">Use safely</text><text x="87" y="75" text-anchor="middle" class="small">search · review</text><text x="87" y="96" text-anchor="middle" class="small">controlled export</text></g>
  <path class="arrow" d="M210 150H270M445 150H505M680 150H740M915 150H975"/>
</svg>
