<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Data quality and duplicate review lifecycle</title><desc id="desc">Imported records receive quality information, missing field visibility, duplicate review and audit history.</desc><rect width="1200" height="300" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#11264b}.box{fill:#fff;stroke:#2b6cb0;stroke-width:2}.arrow{stroke:#2b6cb0;stroke-width:3;marker-end:url(#a)}.label{font-size:20px;font-weight:bold}.small{font-size:16px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#2b6cb0"/></marker></defs><text x="600" y="38" text-anchor="middle" class="label">Review without destructive merge</text><g transform="translate(55 110)"><rect class="box" width="180" height="90" rx="14"/><text x="90" y="43" text-anchor="middle" class="label">Import</text><text x="90" y="68" text-anchor="middle" class="small">source retained</text></g><g transform="translate(290 110)"><rect class="box" width="180" height="90" rx="14"/><text x="90" y="43" text-anchor="middle" class="label">Quality score</text><text x="90" y="68" text-anchor="middle" class="small">missing fields</text></g><g transform="translate(525 110)"><rect class="box" width="180" height="90" rx="14"/><text x="90" y="43" text-anchor="middle" class="label">Candidate</text><text x="90" y="68" text-anchor="middle" class="small">explainable reasons</text></g><g transform="translate(760 110)"><rect class="box" width="180" height="90" rx="14"/><text x="90" y="43" text-anchor="middle" class="label">Review</text><text x="90" y="68" text-anchor="middle" class="small">approve or reject</text></g><g transform="translate(995 110)"><rect class="box" width="150" height="90" rx="14"/><text x="75" y="43" text-anchor="middle" class="label">Audit</text><text x="75" y="68" text-anchor="middle" class="small">history</text></g><path class="arrow" d="M235 155H290M470 155H525M705 155H760M940 155H995"/></svg>
