<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Independent multi-location search</title><desc id="desc">One search is divided into bounded tasks for separate locations and returned as separate results.</desc><rect width="1200" height="360" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#11264b}.box{fill:#fff;stroke:#2b6cb0;stroke-width:2}.arrow{stroke:#2b6cb0;stroke-width:3;marker-end:url(#a)}.label{font-size:20px;font-weight:bold}.small{font-size:16px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#2b6cb0"/></marker></defs><text x="600" y="38" text-anchor="middle" class="label">One request, bounded independent location tasks</text><rect class="box" x="40" y="130" width="210" height="100" rx="14"/><text x="145" y="170" text-anchor="middle" class="label">Search request</text><text x="145" y="198" text-anchor="middle" class="small">keyword + locations</text><path class="arrow" d="M250 180H365"/>
<g><rect class="box" x="365" y="70" width="210" height="70" rx="12"/><text x="470" y="112" text-anchor="middle" class="label">Location A</text><rect class="box" x="365" y="145" width="210" height="70" rx="12"/><text x="470" y="187" text-anchor="middle" class="label">Location B</text><rect class="box" x="365" y="220" width="210" height="70" rx="12"/><text x="470" y="262" text-anchor="middle" class="label">Location C</text></g><path class="arrow" d="M575 105H710M575 180H710M575 255H710"/><rect class="box" x="710" y="105" width="220" height="150" rx="14"/><text x="820" y="150" text-anchor="middle" class="label">Bounded service</text><text x="820" y="180" text-anchor="middle" class="small">limits · cache · retries</text><text x="820" y="206" text-anchor="middle" class="small">failure isolation</text><path class="arrow" d="M930 180H1010"/><rect class="box" x="1010" y="130" width="155" height="100" rx="14"/><text x="1087" y="170" text-anchor="middle" class="label">Separated</text><text x="1087" y="198" text-anchor="middle" class="small">results</text></svg>
