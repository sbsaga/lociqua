<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc"><title id="title">Lociqua workspace role permissions</title><desc id="desc">A matrix showing viewers read, editors manage data and duplicate reviews, and owners also manage members.</desc><rect width="1000" height="350" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#11264b}.head{font-size:20px;font-weight:bold}.cell{font-size:17px}.line{stroke:#9eb7d7;stroke-width:2}.yes{fill:#087f5b;font-weight:bold}.no{fill:#8a2432;font-weight:bold}</style><text x="500" y="38" text-anchor="middle" class="head">Workspace permissions</text><rect x="55" y="70" width="890" height="230" fill="#fff" stroke="#2b6cb0" stroke-width="2" rx="12"/><path class="line" d="M55 125H945M55 183H945M55 241H945M340 70V300M550 70V300M750 70V300"/><text x="190" y="105" text-anchor="middle" class="head">Capability</text><text x="445" y="105" text-anchor="middle" class="head">Viewer</text><text x="650" y="105" text-anchor="middle" class="head">Editor</text><text x="847" y="105" text-anchor="middle" class="head">Owner</text><text x="190" y="160" text-anchor="middle" class="cell">Search and view records</text><text x="445" y="160" text-anchor="middle" class="yes">Yes</text><text x="650" y="160" text-anchor="middle" class="yes">Yes</text><text x="847" y="160" text-anchor="middle" class="yes">Yes</text><text x="190" y="218" text-anchor="middle" class="cell">Import, export, review duplicates</text><text x="445" y="218" text-anchor="middle" class="no">No</text><text x="650" y="218" text-anchor="middle" class="yes">Yes</text><text x="847" y="218" text-anchor="middle" class="yes">Yes</text><text x="190" y="276" text-anchor="middle" class="cell">Manage workspace members</text><text x="445" y="276" text-anchor="middle" class="no">No</text><text x="650" y="276" text-anchor="middle" class="no">No</text><text x="847" y="276" text-anchor="middle" class="yes">Yes</text></svg>
