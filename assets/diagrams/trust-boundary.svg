<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Self-hosted trust boundary</title><desc id="desc">Browser access passes through an identity and TLS boundary to a reverse proxy, application, database and worker queue.</desc><rect width="1200" height="330" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#11264b}.box{fill:#fff;stroke:#2b6cb0;stroke-width:2}.boundary{fill:none;stroke:#2b6cb0;stroke-dasharray:8 6;stroke-width:2}.arrow{stroke:#2b6cb0;stroke-width:3;marker-end:url(#a)}.label{font-size:20px;font-weight:bold}.small{font-size:16px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#2b6cb0"/></marker></defs><text x="600" y="38" text-anchor="middle" class="label">Self-hosted access and data boundary</text><rect class="box" x="35" y="130" width="150" height="75" rx="12"/><text x="110" y="175" text-anchor="middle" class="label">Browser</text><path class="arrow" d="M185 167H285"/><rect class="box" x="285" y="110" width="190" height="115" rx="12"/><text x="380" y="154" text-anchor="middle" class="label">TLS + identity</text><text x="380" y="184" text-anchor="middle" class="small">operator-managed edge</text><path class="arrow" d="M475 167H565"/><rect class="boundary" x="565" y="70" width="595" height="210" rx="16"/><text x="590" y="101" class="small">Operator-controlled environment</text><rect class="box" x="600" y="130" width="130" height="75" rx="12"/><text x="665" y="175" text-anchor="middle" class="label">Proxy</text><path class="arrow" d="M730 167H785"/><rect class="box" x="785" y="130" width="140" height="75" rx="12"/><text x="855" y="175" text-anchor="middle" class="label">Lociqua</text><path class="arrow" d="M925 145H985M925 190H985"/><rect class="box" x="985" y="105" width="135" height="65" rx="12"/><text x="1052" y="145" text-anchor="middle" class="label">PostgreSQL</text><rect class="box" x="985" y="185" width="135" height="65" rx="12"/><text x="1052" y="225" text-anchor="middle" class="label">Redis + worker</text></svg>
