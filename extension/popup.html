<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lociqua capture</title>
<style>body{font:14px system-ui,sans-serif;margin:14px;width:330px;color:#172033}label{display:block;margin-top:9px;font-weight:600}input,textarea,select,button{box-sizing:border-box;width:100%;padding:8px;margin-top:4px;border:1px solid #b9c6d5;border-radius:6px;font:inherit}button{background:#0759ba;color:white;border:0;font-weight:700;cursor:pointer}.note{color:#536275;font-size:12px}.hidden{display:none}#message{white-space:pre-wrap}</style>
<body><h1>Lociqua evidence</h1><p class="note">Only saves fields you confirm from an approved website. It never crawls or searches websites.</p>
<section id="setup"><label>Lociqua URL<input id="baseUrl" placeholder="https://lociqua.example.com"></label><label>Short-lived access token<input id="token" type="password"></label><button id="saveSetup">Save secure session</button></section>
<section id="capture" class="hidden"><label>Approved source policy<select id="policy"></select></label><label>Company name<input id="name"></label><label>Website<input id="website"></label><label>Phone<input id="phone"></label><label>Address<textarea id="address"></textarea></label><label>City<input id="city"></label><label>Notes / description<textarea id="description"></textarea></label><p class="note" id="page"></p><button id="captureButton">Review and save evidence</button></section><p id="message" class="note"></p><script src="popup.js"></script></body></html>
